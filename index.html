
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(
                135deg,
                #091a38 0%,
                #102b5b 55%,
                #15366e 100%
            );
            color: white;
            position: relative;
        }

        /* Decorative circles */
        body::before {
            content: "";
            position: absolute;
            width: 230px;
            height: 230px;
            top: -70px;
            right: -115px;
            border-radius: 50%;
            background: rgba(43, 83, 151, 0.13);
        }

        body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            bottom: -120px;
            left: -150px;
            border-radius: 50%;
            background: rgba(43, 83, 151, 0.13);
        }

        .welcome-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        /* Graduation cap */
        .cap-icon {
            width: 65px;
            height: 55px;
            margin: 0 auto 10px;
        }

        .cap-icon svg {
            width: 100%;
            height: 100%;
            fill: white;
        }

        h1 {
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.2px;
        }

        .tagline {
            font-size: 14px;
            color: #9db4d8;
            margin-bottom: 27px;
            letter-spacing: 0.3px;
        }

        .tagline span {
            margin: 0 5px;
            color: #d1def3;
        }

        .dashboard-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 23px;
            background: #087cf0;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background 0.25s ease,
                        transform 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .dashboard-button:hover {
            background: #0068d9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 112, 255, 0.25);
        }

        .arrow {
            font-size: 19px;
            line-height: 1;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 21px;
            }

            .tagline {
                font-size: 12px;
            }

            .welcome-container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="welcome-container">

        <div class="cap-icon">
            <svg viewBox="0 0 100 80"
                 xmlns="http://www.w3.org/2000/svg"
                 aria-label="Graduation cap"
                 role="img">

                <path d="M2 25 L50 5 L98 25 L50 47 Z"/>

                <path d="M22 35 V51
                         C22 59 38 67 50 67
                         C62 67 78 59 78 51
                         V35 L50 48 Z"/>

                <path d="M92 28 V53 H97 V27 Z"/>

                <circle cx="94.5" cy="57" r="4"/>

                <path d="M17 33 V50 H22 V35 Z"/>

                <circle cx="19.5" cy="55" r="4"/>
            </svg>
        </div>

        <h1>Placement Management System</h1>

        <p class="tagline">
            Connect <span>·</span>
            Manage <span>·</span>
            Build Your Future
        </p>

        <a href="dashboard.html" class="dashboard-button">
            Enter Dashboard
            <span class="arrow">→</span>
        </a>

    </main>

</body>
</html>
